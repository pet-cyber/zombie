<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAD ZONE // Tactical Survival</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <header class="game-header">
            <div class="brand">
                <span class="hazard-badge">☣</span>
                <span class="title">DEAD ZONE</span>
                <span class="sector-tag">// SECTOR 07 QUARANTINE</span>
            </div>
            <div class="controls-hint">
                <span>[WASD] MOVE</span>
                <span>[MOUSE] AIM / FLASHLIGHT</span>
                <span>[SPACE] FIRE</span>
                <span>[1-3] ARSENAL</span>
                <span>[F] TOGGLE LIGHT</span>
            </div>
        </header>
        
        <div class="canvas-container">
            <canvas id="gameCanvas" width="960" height="640"></canvas>
            <div class="scanlines"></div>
            <div class="vignette"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
